[package]
name = "footprint_renderer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
tiny-skia = "0.11"
png = "0.17.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-webpki-roots"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.24.0", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Enable link-time optimization
codegen-units = 1      # Reduce parallel code generation to enable more LTO
strip = true           # Automatically strip symbols from the binary
panic = "abort"        # Reduce binary size by removing unwinding code
